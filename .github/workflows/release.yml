name: Release (Manual Fallback)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate and publish artifacts for (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.26"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Validate version consistency
        env:
          # Via env, not interpolated into the script: workflow_dispatch input is free text.
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          python .github/scripts/check_versions.py --tag "$RELEASE_TAG"

      - name: Verify golangci configuration
        run: |
          cd whatsapp-bridge
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 config verify

      - name: Run Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: whatsapp-bridge

      - name: Run Go tests
        run: |
          cd whatsapp-bridge
          go test ./...

      - name: Build Go bridge
        run: |
          cd whatsapp-bridge
          go build -v ./...

      - name: Run Python tests
        run: |
          cd whatsapp-mcp-server
          uv sync --extra dev
          uv run pytest -q

  publish-github-release:
    name: Publish GitHub Release
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.26"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Build release artifacts
        run: |
          mkdir -p dist

          cd whatsapp-bridge
          GOOS=linux GOARCH=amd64 go build -o ../dist/whatsapp-bridge-linux-amd64 .
          cd ..

          cd whatsapp-mcp-server
          uv build --out-dir ../dist
          cd ..

          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
